<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tribes 2 server emblem</title>
  <desc id="dsc">The Tribes 2 twin-fork mark with shortened legs, standing on a stack of three rack-mounted servers, in metallic teal.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16ffc6"/>
      <stop offset=".5" stop-color="#09cf9f"/>
      <stop offset="1" stop-color="#05926e"/>
    </linearGradient>
  </defs>

  <!-- twin-fork mark, short legs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 152 L108 124 L62 92 L96 30 M148 152 L148 124 L194 92 L160 30" stroke="#03261d" stroke-width="30"/>
    <path d="M108 152 L108 124 L62 92 L96 30 M148 152 L148 124 L194 92 L160 30" stroke="url(#g)" stroke-width="20"/>
  </g>
  <g stroke="#3f4a44" stroke-width="2">
    <circle cx="108" cy="124" r="7" fill="#cfd8d2"/>
    <circle cx="148" cy="124" r="7" fill="#cfd8d2"/>
  </g>

