<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tribes 2 server emblem</title>
  <desc id="dsc">The Tribes 2 twin-fork mark with shortened legs, standing on a stack of three rack-mounted servers, in classic gold.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c14e"/>
      <stop offset=".5" stop-color="#c4881c"/>
      <stop offset="1" stop-color="#8a5a0e"/>
    </linearGradient>
  </defs>

  <!-- twin-fork mark, short legs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 152 L108 124 L62 92 L96 30 M148 152 L148 124 L194 92 L160 30" stroke="#1c1305" stroke-width="30"/>
    <path d="M108 152 L108 124 L62 92 L96 30 M148 152 L148 124 L194 92 L160 30" stroke="url(#g)" stroke-width="20"/>
  </g>
