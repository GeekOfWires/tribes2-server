<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tribes 2 server emblem</title>
  <desc id="dsc">An angular hexagonal crest with an upward chevron and an energy core, in teal and mint.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46f0c4"/>
      <stop offset=".5" stop-color="#129a78"/>
      <stop offset="1" stop-color="#053428"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cffdf0" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#1c8e6f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="field" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#0f2c24"/>
      <stop offset="1" stop-color="#04100b"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0afabb"/>
      <stop offset="1" stop-color="#03b083"/>
    </linearGradient>
  </defs>

  <polygon points="128,8 232,68 232,188 128,248 24,188 24,68" fill="#05e0a3" opacity=".12"/>
  <polygon points="128,16 225,72 225,184 128,240 31,184 31,72" fill="url(#metal)" stroke="#0afabb" stroke-opacity=".6" stroke-width="1.5"/>
  <polygon points="128,40 205,84 205,172 128,216 51,172 51,84" fill="url(#field)" stroke="#06e0a3" stroke-opacity=".5" stroke-width="2"/>
  <polygon points="128,16 225,72 225,184 128,240 31,184 31,72" fill="url(#bevel)"/>
  <polygon points="128,48 197,88 197,168 128,208 59,168 59,88" fill="none" stroke="#7df3d6" stroke-opacity=".22" stroke-width="1.5"/>

  <g transform="translate(0,6)">
    <path d="M128 58 L198 150 L168 150 L128 100 L88 150 L58 150 Z" fill="url(#mint)"/>
    <path d="M128 120 L150 144 L128 168 L106 144 Z" fill="#d6fdf1"/>
  </g>

  <g fill="#0a221b" stroke="#7df3d6" stroke-opacity=".4" stroke-width="1.2">
    <circle cx="128" cy="30" r="3.1"/><circle cx="214" cy="78" r="3.1"/><circle cx="214" cy="178" r="3.1"/>
    <circle cx="128" cy="226" r="3.1"/><circle cx="42" cy="178" r="3.1"/><circle cx="42" cy="78" r="3.1"/>
  </g>
</svg>
