# GitHub Pages config for the docs site, served at
#   https://geekofwires.github.io/tribes2-server/
title: Tribes 2 Dedicated Server
description: Tribes 2 dedicated server container + ASP.NET Core control panel — documentation.

# Project-site URL (repo: github.com/GeekOfWires/tribes2-server)
url: https://geekofwires.github.io
baseurl: /tribes2-server

# Theme: just-the-docs (sidebar nav + search). Built via Bundler in the Pages workflow.
theme: just-the-docs
logo: "/assets/icon.svg"

# Dark base; retinted to the control-panel palette in _sass/custom/custom.scss.
color_scheme: dark

search_enabled: true
heading_anchors: true

aux_links:
  "GitHub repository":
    - "https://github.com/GeekOfWires/tribes2-server"
aux_links_new_tab: true

# Turn relative .md links into rendered links, and use README.md as the index of /.
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: true   # our README.md has front matter (title/nav_order); still use it as /

# Apply the just-the-docs layout to every page (incl. the README-derived index).
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Don't let Jekyll try to process build scaffolding.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
